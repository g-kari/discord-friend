name: Shared voice Cloudflare
on:
  pull_request:
    branches: [main]
    paths: ['apps/voice/**', 'deploy/cloudflare/**', '.dockerignore', '.github/workflows/shared-voice.yml']
  push:
    branches: [main]
    paths: ['apps/voice/**', 'deploy/cloudflare/**', '.dockerignore', '.github/workflows/shared-voice.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - run: npm ci --ignore-scripts && npm test && npm run check && npm audit --audit-level=high
        working-directory: apps/voice
      - run: npm ci --ignore-scripts && npm run types && npm run check && npm audit --audit-level=high
        working-directory: deploy/cloudflare
      - name: Build Discord image without connecting an account
        run: docker build -f apps/voice/Dockerfile.bot -t voice-bot-test .
      - name: Verify DAVE and Opus dependencies without credentials
        run: docker run --rm --network none voice-bot-test node -e "import('@discordjs/voice').then(v => console.log(v.generateDependencyReport()))"
  voicevox-image:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build private synthesis image
        run: docker build -f apps/voice/Dockerfile.tts -t voice-tts-test .
      - name: Test real synthetic speech with no external network
        run: |
          docker run -d --name voice-tts-test --network none voice-tts-test
          trap 'docker rm -f voice-tts-test >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 60); do
            if docker exec voice-tts-test node --input-type=module -e '
              const response = await fetch("http://127.0.0.1:8080/v1/speech", {method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify({text:"こんにちは。音声テストです。"})});
              if (!response.ok) process.exit(1);
              const {assertWav} = await import("/app/src/policy.js");
              const bytes = new Uint8Array(await response.arrayBuffer()); assertWav(bytes);
              console.log(JSON.stringify({format:"PCM16 stereo 48000Hz", bytes:bytes.length}));
            '; then exit 0; fi
            sleep 2
          done
          exit 1
